<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`. The site is served from the domain root, so this is "/". -->
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PopupDeck: a pop-up deck of macro keys for Windows</title>
  <meta name="description" content="Press a trigger key and a deck of macro keys pops up under your cursor: paste snippets, send shortcuts, open apps and control media. Works fully offline. Free 7-day trial for Windows 10 and 11.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#101113" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#EEF0F3" media="(prefers-color-scheme: light)">

  <meta property="og:title" content="PopupDeck: your shortcuts, one keypress away">
  <meta property="og:description" content="A pop-up deck of macro keys for Windows. Works fully offline. Free 7-day trial.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/assets/media/hero-dark.webp">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown for the moment before Flutter starts, in the app's own colours, so there is no white flash. */
    :root { --bg: #EEF0F3; --dim: #666B74; }
    @media (prefers-color-scheme: dark) { :root { --bg: #101113; --dim: #8A8D93; } }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash img { width: 56px; height: 56px; opacity: .9; }
    noscript p { font: 16px/1.6 system-ui, sans-serif; color: var(--dim); max-width: 560px; margin: 40vh auto 0; padding: 0 16px; text-align: center; }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="icons/Icon-192.png" alt=""></div>
  <noscript>
    <p>PopupDeck is a pop-up deck of macro keys for Windows 10 and 11. It works fully offline and comes with a free 7-day trial.
      This page needs JavaScript to show downloads.</p>
  </noscript>
  <script>
    // Remove the splash as soon as Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash'); if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
